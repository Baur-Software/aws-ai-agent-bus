version: '3.8'

services:
  localstack:
    container_name: agent-mesh-localstack
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"            # LocalStack Gateway
      - "4510-4559:4510-4559"  # External services port range
    environment:
      - SERVICES=dynamodb,s3,events,secretsmanager,stepfunctions,ecs,logs
      - DEBUG=1
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./localstack-data}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Rust MCP Server Tests
  # Uses the existing Dockerfile.build which includes Rust toolchain
  mcp-rust-test:
    build:
      context: ./mcp-rust
      dockerfile: Dockerfile.build
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - RUST_LOG=debug
      - AGENT_MESH_KV_TABLE=agent-mesh-kv
      - AGENT_MESH_ARTIFACTS_BUCKET=agent-mesh-artifacts
      - AGENT_MESH_EVENT_BUS=agent-mesh-events
    working_dir: /app
    command: cargo test

  # Dashboard Server Tests
  dashboard-server-test:
    build:
      context: ./dashboard-server
      dockerfile: Dockerfile
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - NODE_ENV=test
    working_dir: /app
    command: bun test

networks:
  default:
    name: agent-mesh-test